name: WDTT laboratory build-only
on:
  workflow_dispatch:
  pull_request:
    branches: [gh-action-build]
    paths: ['wdtt/**', '.github/workflows/build-wdtt-lab.yml']
permissions:
  contents: read
concurrency:
  group: wdtt-lab-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Install emulation for CLI probes only
        run: sudo apt-get update && sudo apt-get install -y qemu-user zstd
      - name: Fetch and verify existing pinned SDK (no toolchain upgrade)
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 2 https://github.com/ownik/entware-sdk/releases/download/v2026.07.04/entware-sdk-aarch64-3.10_gcc-8.4.0_glibc-2.27.Linux-x86_64.tar.zst -o sdk.tar.zst
          echo 'd51f30c126425ebff203b107a1a0aa9d3a5844f6c481bc6ff4c117cadc208674  sdk.tar.zst' | sha256sum -c -
          mkdir sdk-root
          tar --zstd -xf sdk.tar.zst -C sdk-root --wildcards --wildcards-match-slash '*staging_dir/host/go/*'
      - name: Security, protocol fixture, cross-build, ELF and CLI checks
        shell: bash
        run: |
          set -euo pipefail
          go_bin="$(find sdk-root -type f -path '*/host/go/bin/go')"
          test -n "$go_bin"
          python3 wdtt/build_lab.py --go "$go_bin" --sdk-archive sdk.tar.zst --work wdtt-build
          python3 wdtt/test_packaging.py
      - name: Checkout exact offline converter revision from KAS experiment
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: saymer-alt/keenetic-auto-setup
          ref: 79b9f7c500a81634a4ce7c62e4cff9a36e4fd5a8
          path: kas-poc
      - name: Local-only TURN, DTLS, WireGuard and Mihomo functional acceptance
        run: |
          python3 wdtt/fetch_test_mihomo.py wdtt-build/test-deps
          python3 wdtt/local_pair.py --harness wdtt-build/server-pair.test --client wdtt-build/wt-client-linux-amd64 --mihomo wdtt-build/test-deps/mihomo-compatible --converter kas-poc/experimental/wdtt/wg_to_mihomo.py --report wdtt-build/local-pair-report.json
      - name: Prepare clearly marked owner test binaries (not an IPK or release)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p wdtt-build/owner-download/licenses
          for arch in amd64 arm64 mipsle mips; do
            cp "wdtt-build/wt-client-linux-$arch" wdtt-build/owner-download/
          done
          cp wdtt/EXPERIMENTAL-DOWNLOAD-WARNING.md wdtt-build/owner-download/README-FIRST-EXPERIMENTAL.md
          cp wdtt/licenses/UPSTREAM-GPL-3.0.txt wdtt-build/owner-download/licenses/
          cp wdtt/licenses/awgmproto-MIT.txt wdtt-build/owner-download/licenses/
          cp wdtt/licenses/PHASE1-dependency-inventory.json wdtt-build/owner-download/licenses/
          cp wdtt-build/build-report.json wdtt-build/owner-download/
          python3 - <<'PY'
          import hashlib,json,pathlib
          root=pathlib.Path('wdtt-build/owner-download')
          report=json.loads((root/'build-report.json').read_text())
          lines=[]
          for record in report['builds']:
              target=root/('wt-client-linux-'+record['arch'])
              checksum=hashlib.sha256(target.read_bytes()).hexdigest()
              assert checksum==record['sha256'],record['arch']
              lines.append(f"{checksum}  {target.name}")
          (root/'SHA256SUMS').write_text('\n'.join(lines)+'\n')
          assert (root/'README-FIRST-EXPERIMENTAL.md').read_text().startswith('# ⚠️⚠️⚠️')
          PY
          tar --sort=name --mtime='UTC 1970-01-01' --owner=0 --group=0 --numeric-owner \
            -C wdtt-build/owner-download -czf wdtt-build/wdtt-EXPERIMENTAL-OWNER-TEST-BINARIES.tar.gz .
      - name: Downloadable experimental binaries (NOT production; NOT license clearance)
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: WDTT-EXPERIMENTAL-NOT-FOR-PRODUCTION
          path: wdtt-build/wdtt-EXPERIMENTAL-OWNER-TEST-BINARIES.tar.gz
          if-no-files-found: error
          retention-days: 14
      - name: Retain evidence (no IPK, release or package feed publication)
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: wdtt-laboratory-evidence
          path: |
            wdtt-build/build-report.json
            wdtt-build/local-pair-report.json
            wdtt-build/server-auth-baseline.txt
            wdtt-build/test-deps/mihomo-test-digest.json
          if-no-files-found: error
          retention-days: 14
