name: Sync upstream

on:
  workflow_dispatch:
  schedule:
    - cron: '30 2 * * *'

permissions:
  contents: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fork (full history)
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Fetch upstream and check for new commits
        id: check
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/Entware/entware-go.git
          git fetch upstream master
          COUNT=$(git rev-list --count HEAD..upstream/master)
          UPSTREAM_SHA=$(git rev-parse upstream/master)
          echo "New upstream commits: ${COUNT} (upstream/master ${UPSTREAM_SHA})"
          echo "count=${COUNT}" >> "$GITHUB_OUTPUT"
          echo "upstream_sha=${UPSTREAM_SHA}" >> "$GITHUB_OUTPUT"

      - name: Upstream unchanged - green exit
        if: steps.check.outputs.count == '0'
        env:
          UPSTREAM_SHA: ${{ steps.check.outputs.upstream_sha }}
        run: |
          echo "gh-action-build already contains upstream/master ($UPSTREAM_SHA). Nothing to do."

      - name: Attempt clean merge
        if: steps.check.outputs.count != '0'
        id: merge
        continue-on-error: true
        run: git merge --no-commit --no-ff upstream/master

      - name: Clean merge - commit and push
        if: steps.check.outputs.count != '0' && steps.merge.outcome == 'success'
        env:
          UPSTREAM_SHA: ${{ steps.check.outputs.upstream_sha }}
        run: |
          git commit -m "Sync upstream Entware/entware-go master ${UPSTREAM_SHA}" \
            -m "Regular merge commit: no force push, no history rewrite, no conflict auto-resolution."
          git push origin HEAD:gh-action-build

      - name: Conflicts - report without publishing unsafe branches
        if: steps.check.outputs.count != '0' && steps.merge.outcome == 'failure'
        env:
          UPSTREAM_SHA: ${{ steps.check.outputs.upstream_sha }}
        run: |
          # The checked-out workspace is disposable: never commit conflict
          # markers, publish a diagnostic branch or open an unreviewed PR.
          set -eu
          git diff --name-only --diff-filter=U > /tmp/sync-conflicts.txt
          {
            echo "### Upstream sync: manual resolution required"
            echo
            echo "Upstream: Entware/entware-go@${UPSTREAM_SHA}"
            echo "Target: gh-action-build (untouched)"
            echo
            if [ -s /tmp/sync-conflicts.txt ]; then
              echo "Conflicted files:"
              sed "s/^/- /" /tmp/sync-conflicts.txt
            else
              echo "Merge failed without unmerged paths. Inspect the merge step logs."
            fi
            echo
            echo "No branch or PR was created. Resolve conflicts on a reviewed branch."
            echo "Do not force-push or auto-select ours/theirs."
          } >> "$GITHUB_STEP_SUMMARY"
          if [ -s /tmp/sync-conflicts.txt ]; then
            echo "Unresolved upstream merge conflicts:"
            cat /tmp/sync-conflicts.txt
            echo "::error::Upstream merge conflicts require manual resolution; gh-action-build was not modified."
          else
            echo "::error::Upstream merge failed without conflict paths; inspect the merge logs."
          fi
          exit 1
