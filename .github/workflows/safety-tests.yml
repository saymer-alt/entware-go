name: Publication and installer safety
on:
  pull_request:
    branches: [gh-action-build]
  push:
    branches: [gh-action-build]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regressions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Check scoped agent guidance (no network)
        run: python3 tests/check_agent_guidance.py
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y busybox shellcheck jq
          sh -n warpscout/install.sh
          sh -n warpscout/update.sh
          busybox ash -n warpscout/install.sh
          busybox ash -n warpscout/update.sh
          shellcheck -S error warpscout/install.sh warpscout/update.sh
          # TeleMT package scripts: syntax/static plus isolated mock GitHub/opkg tests.
          sh -n telemt/entware-manager.sh telemt/install.sh telemt/upgrade.sh telemt/tests/test-entware-manager.sh
          busybox ash -n telemt/entware-manager.sh
          busybox ash -n telemt/install.sh
          busybox ash -n telemt/upgrade.sh
          shellcheck -S error telemt/entware-manager.sh telemt/install.sh telemt/upgrade.sh telemt/tests/test-entware-manager.sh
          sudo env PATH="$PATH" sh telemt/tests/test-entware-manager.sh
          python3 -m unittest discover -s tests -p 'test_*.py'
          INSTALL_TEST_SHELL=busybox python3 -m unittest discover -s tests -p 'test_warpscout_installer.py'
          INSTALL_TEST_SHELL=busybox python3 -m unittest discover -s tests -p 'test_warpscout_updater.py'
