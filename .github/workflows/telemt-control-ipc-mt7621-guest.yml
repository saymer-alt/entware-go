# Single bounded QEMU-system MT7621 laboratory cycle. No release or feed.
name: TeleMT IPC MT7621 kernel 4.9 guest (no release)

on:
  pull_request:
    # Ordinary updates run the cheap safety checks. A *new label event*
    # explicitly authorizes a single native QEMU guest cycle.
    types: [opened, reopened, synchronize, labeled]
    branches: [gh-action-build]
    paths:
      - '.github/workflows/telemt-control-ipc-mt7621-guest.yml'
      - 'docs/research/telemt-control-ipc/mt7621_guest.py'
      - 'docs/research/telemt-control-ipc/test_mt7621_guest_plan.py'
  # This research-only workflow is NOT on the default branch. GitHub only
  # accepts workflow_dispatch for workflow files already present there.
  # Avoid merging unaccepted lab code just to unblock manual CI.
  # Label the specific Draft PR once with "telemt-ipc-one-shot-qemu" to send a
  # one-shot pull_request/labeled event; ordinary commits never run QEMU.

permissions:
  contents: read
  actions: read

concurrency:
  group: telemt-ipc-guest-research
  cancel-in-progress: false

env:
  EMULATOR_SHA: 64a446deaacb0bca10d6053781ff1f7ad4a29552
  IPC_NAME: telemt-ipc-lab_3.5.17-1ipc2_mipsel-3.4.ipk
  IPC_SHA: fbf5ef4c2cad4a564483c29a584986623181574b798ec5b787cdc93c27e15daa
  # Frozen variant A reference: the already accepted Core 3.5.17-2fb1 build.
  # Read-only download; the accepted IPK, ELF and all original pins are
  # never modified or rebuilt by this workflow.
  CORE_IPK_NAME: telemt_3.5.17-2fb1_mipsel-3.4.ipk
  CORE_IPK_SHA: 2c8a84fb93535303eeb4bb8a0a5057370f4e625b1cdf0e102f04e33e28c85d8d
  CORE_ARTIFACT_RUN_ID: '44046020268'

jobs:
  safety:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Research-only PR and Python syntax gate
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$HEAD_SHA" && test -n "$BASE_SHA"
          test "$BASE_SHA" != "$HEAD_SHA"
          changed=$(git diff --name-only "$BASE_SHA...$HEAD_SHA")
          allowed='^(docs/research/telemt-control-ipc/|\.github/workflows/telemt-control-ipc-(source|mipsle-build|mt7621-guest)\.yml$)'
          if echo "$changed" | grep -qvE "$allowed"; then
            echo "::error::Research boundary violation"; exit 1
          fi
          python3 -m py_compile docs/research/telemt-control-ipc/mt7621_guest.py
          python3 -m py_compile docs/research/telemt-control-ipc/test_mt7621_guest_plan.py
          python3 -m py_compile docs/research/telemt-control-ipc/prefetch_entware_assets.py
          echo 'GUEST_RESEARCH_ISOLATION: PASS'
      - name: Fetch SHA-pinned public emulator fixture for cheap offline tests
        uses: actions/checkout@v4
        with:
          repository: saymer-alt/router-emulator
          ref: 64a446deaacb0bca10d6053781ff1f7ad4a29552
          persist-credentials: false
          path: emulator
      - name: Validate plan with native emulator parser, no QEMU or IPK execution
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C emulator rev-parse HEAD)" = "$EMULATOR_SHA"
          python3 docs/research/telemt-control-ipc/test_mt7621_guest_plan.py \
            --emulator-root emulator
          python3 docs/research/telemt-control-ipc/prefetch_entware_assets.py \
            --emulator-root emulator --check-only
          echo 'IPC_HOST_ONLY_GUEST_CONTRACT: PASS'

  native-guest:
    needs: safety
    # FAIL CLOSED: only an explicit *new label* action against Draft PR #58,
    # on this same-repo pinned research branch, can run the expensive QEMU
    # guest. An already-present label cannot reauthorize on new commits.
    if: ${{ github.event_name == 'pull_request' && github.event.action == 'labeled' && github.event.label.name == 'telemt-ipc-one-shot-qemu' && github.event.pull_request.number == 58 && github.event.pull_request.head.ref == 'research/telemt-mipsle-daemon-ipc-20261117' && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: saymer-alt/router-emulator
          ref: 64a446deaacb0bca10d6053781ff1f7ad4a29552
          persist-credentials: false
          path: emulator
      - name: Immutable upstream emulator identity
        run: |
          set -euo pipefail
          test "$(git -C emulator rev-parse HEAD)" = "$EMULATOR_SHA"
          echo 'PINNED_EMULATOR: PASS'
      - name: Download exact lab IPK from existing successful build (same repo)
        uses: actions/download-artifact@v4
        with:
          name: telemt-ipc-lab-mipsel-3.4
          repository: saymer-alt/entware-go
          run-id: 44139876820
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/ipc-ipk
      - name: Fail closed on wrong/missing IPK bytes
        shell: bash
        run: |
          set -euo pipefail
          test "$(find "$RUNNER_TEMP/ipc-ipk" -maxdepth 1 -type f | wc -l)" -eq 1
          test -f "$RUNNER_TEMP/ipc-ipk/$IPC_NAME"
          printf '%s  %s\n' "$IPC_SHA" "$RUNNER_TEMP/ipc-ipk/$IPC_NAME" | sha256sum -c -
          echo 'PINNED_LAB_IPK: PASS'
      - name: Download frozen accepted Core IPK (variant A reference, read-only)
        uses: actions/download-artifact@v4
        with:
          name: telemt-core-mipsel-experimental-getfb
          repository: saymer-alt/entware-go
          run-id: ${{ env.CORE_ARTIFACT_RUN_ID }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/core-ipk
      - name: Fail closed on wrong/missing accepted Core IPK bytes
        shell: bash
        run: |
          set -euo pipefail
          test "$(find "$RUNNER_TEMP/core-ipk" -maxdepth 1 -type f | wc -l)" -eq 1
          test -f "$RUNNER_TEMP/core-ipk/$CORE_IPK_NAME"
          printf '%s  %s\n' "$CORE_IPK_SHA" "$RUNNER_TEMP/core-ipk/$CORE_IPK_NAME" | sha256sum -c -
          echo 'PINNED_CORE_IPK: PASS'
      - name: Install existing emulator runtime dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            p7zip-full socat e2fsprogs openssl python3 python3-paramiko \
            build-essential ninja-build meson pkg-config libglib2.0-dev \
            libpixman-1-dev zlib1g-dev libslirp-dev libfdt-dev python3-venv
      - name: Validate exact ELF, archive, and narrow scenario before QEMU
        shell: bash
        run: |
          set -euo pipefail
          python3 docs/research/telemt-control-ipc/mt7621_guest.py \
            --emulator-root emulator --ipk-dir "$RUNNER_TEMP/ipc-ipk" \
            --core-ipk-dir "$RUNNER_TEMP/core-ipk" --plan-only
          echo 'LAB_IPK_AND_SCENARIO: PASS'
      - name: Cache exact patched QEMU-system-mipsel
        id: qemu-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ${{ runner.temp }}/mt7621-qemu/qemu-system-mipsel
            ${{ runner.temp }}/mt7621-qemu/qemu-mipsel.sha256
          key: ipc-mt7621-ubuntu24-v10.1.0-${{ hashFiles('emulator/qemu-patches/*.patch', 'emulator/lab/mt7621/build_qemu_mipsel.sh') }}
      - name: Build QEMU only if cache absent
        if: steps.qemu-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          cd emulator
          bash lab/mt7621/build_qemu_mipsel.sh "$RUNNER_TEMP/mt7621-qemu"
      - name: Verify QEMU SHA before guest launch
        run: |
          set -euo pipefail
          sha256sum -c "$RUNNER_TEMP/mt7621-qemu/qemu-mipsel.sha256"
          test -x "$RUNNER_TEMP/mt7621-qemu/qemu-system-mipsel"
          echo "QEMU_BIN=$RUNNER_TEMP/mt7621-qemu/qemu-system-mipsel" >> "$GITHUB_ENV"
      - name: Save verified QEMU cache before any guest execution
        if: steps.qemu-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ${{ runner.temp }}/mt7621-qemu/qemu-system-mipsel
            ${{ runner.temp }}/mt7621-qemu/qemu-mipsel.sha256
          key: ipc-mt7621-ubuntu24-v10.1.0-${{ hashFiles('emulator/qemu-patches/*.patch', 'emulator/lab/mt7621/build_qemu_mipsel.sh') }}
      - name: Restore SHA-locked Entware asset cache
        id: entware-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/mt7621-entware-cache
          key: ipc-mt7621-entware-v1-${{ hashFiles('emulator/lab/entware-mipselsf.lock.json') }}
      - name: Prefetch and verify every pinned Entware input before QEMU
        shell: bash
        run: |
          set -euo pipefail
          python3 docs/research/telemt-control-ipc/prefetch_entware_assets.py \
            --emulator-root emulator --cache-dir "$RUNNER_TEMP/mt7621-entware-cache"
      - name: Save verified Entware cache before QEMU
        if: steps.entware-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/mt7621-entware-cache
          key: ipc-mt7621-entware-v1-${{ hashFiles('emulator/lab/entware-mipselsf.lock.json') }}
      - name: Fetch only hash-pinned public Ported 5.1.8 image assets
        shell: bash
        run: |
          set -euo pipefail
          src="$RUNNER_TEMP/mt7621-public"
          mkdir -p "$src"
          curl -fL --retry 3 --connect-timeout 15 --max-time 300 \
            -o "$src/breed.bin" 'https://breed.hackpascal.net/breed-mt7621-xiaomi-r3g.bin'
          echo "05ebb31fd889b148022346179346d91c60a1b4518bdc4d8b9717a62aec638bed  $src/breed.bin" | sha256sum -c -
          curl -fL --retry 3 --connect-timeout 15 --max-time 300 \
            -o "$src/ported.bin" 'https://osvault.project-athens.com/osvault/Xiaomi%20R3G/Xiaomi-R3G_5.1.8.bin'
          echo "05958b9786621ee014bb72551f6458d0672c93370cbce9aec3573c6bba038cb2  $src/ported.bin" | sha256sum -c -
          curl -fL --retry 3 --connect-timeout 15 --max-time 300 \
            -o "$src/Xiaomi-R3G.7z" 'https://osvault.project-athens.com/files/firmware/Xiaomi-R3G.7z'
          echo "397e07a20c6a02911e8fd3be756d23c8  $src/Xiaomi-R3G.7z" | md5sum -c -
          7z x -y -o"$src/unpacked" "$src/Xiaomi-R3G.7z" >/dev/null
          cd emulator
          python3 -m lab.mt7621.ci_assets --unpacked "$src/unpacked" --out "$src/verified"
          rm -rf "$src/unpacked"
      - name: Assemble disposable Ported NAND (never flash a physical router)
        shell: bash
        run: |
          set -euo pipefail
          src="$RUNNER_TEMP/mt7621-public"
          cd emulator
          python3 -m lab.mt7621.prepare_ported_mir3g \
            --breed "$src/breed.bin" --firmware "$src/ported.bin" \
            --uconfig "$src/verified/uconfig.bin" \
            --ustate "$src/verified/ustate.bin" \
            --eeprom "$src/verified/eeprom.bin" \
            --out "$RUNNER_TEMP/mt7621-nand"
      - name: Create disposable private guest SSH login
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          python3 - "$RUNNER_TEMP/mt7621-credentials.json" <<'PY'
          import json, pathlib, secrets, sys
          pathlib.Path(sys.argv[1]).write_text(json.dumps({
              "username": "root", "password": secrets.token_urlsafe(28)
          }), encoding="utf-8")
          PY
      - name: One QEMU-system kernel-4.9 IPC cycle (reboot and rollback included)
        shell: bash
        run: |
          set -euo pipefail
          python3 docs/research/telemt-control-ipc/mt7621_guest.py \
            --emulator-root emulator --ipk-dir "$RUNNER_TEMP/ipc-ipk" \
            --core-ipk-dir "$RUNNER_TEMP/core-ipk" \
            --nand-dir "$RUNNER_TEMP/mt7621-nand" \
            --workspace "$RUNNER_TEMP/mt7621-ipc-workspace" \
            --credentials-file "$RUNNER_TEMP/mt7621-credentials.json" \
            --entware-cache "$RUNNER_TEMP/mt7621-entware-cache" \
            --max-seconds 2400
      - name: Factual sanitized report only
        if: always()
        shell: bash
        run: |
          python3 - "$RUNNER_TEMP" "$GITHUB_STEP_SUMMARY" <<'PY'
          import json, pathlib, sys
          path = pathlib.Path(sys.argv[1])/"mt7621-ipc-workspace"/"report"/"report.json"
          with open(sys.argv[2], "a", encoding="utf-8") as out:
              if path.is_file():
                  report = json.loads(path.read_text())
                  rows = report.get("steps", [])
                  count = sum(row.get("outcome") == "PASS" for row in rows)
                  out.write(f"### IPC MT7621 guest: {report.get('outcome')} "
                            f"({count}/{len(rows)} PASS)\n")
              else:
                  out.write("### IPC MT7621 guest: NOT_TESTED (host-side gate blocked)\n")
          PY
      - name: Upload sanitized report, never upload UART or guest secrets
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: telemt-ipc-mt7621-guest-evidence
          path: |
            ${{ runner.temp }}/mt7621-ipc-workspace/report/report.json
            ${{ runner.temp }}/mt7621-ipc-workspace/report/junit.xml
          if-no-files-found: warn
          retention-days: 7
