# Builds beszel-agent .ipk packages for a fixed, explicitly requested version.
# The default 0.18.7 is the newest beszel known to build with the Go version
# shipped by the Entware SDK (ownik/gh-action-entware-sdk@v1, GOTOOLCHAIN=local).
# The preflight job fetches go.mod of the requested tag and compares its Go
# requirement against the Go actually shipped in the SDK tarball; on mismatch
# it fails with diagnostics before any matrix build. Never upgrade Go inside
# this workflow — build an older beszel version or wait for an Entware SDK
# with a newer Go.

name: Build beszel-agent

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Beszel version to build (tag v<version> of henrygd/beszel, e.g. 0.18.7)'
        required: false
        default: '0.18.7'
        type: string

permissions:
  contents: write

jobs:
  preflight:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - name: Resolve requested version
        id: resolve
        shell: bash
        env:
          RAW_VERSION: ${{ inputs.version }}
        run: |
          version="${RAW_VERSION#v}"
          if ! printf '%s' "$version" | grep -Eq '^[0-9][0-9A-Za-z.+-]*$'; then
            echo "::error::Invalid version '${RAW_VERSION}' (expected something like 0.18.7)"
            exit 1
          fi
          echo "Requested beszel-agent version: ${version}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Check beszel tag exists
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.resolve.outputs.version }}
        run: |
          if ! gh api "repos/henrygd/beszel/git/ref/tags/v${VERSION}" > /dev/null 2>&1; then
            echo "::error::Tag v${VERSION} not found in henrygd/beszel — check the version input"
            exit 1
          fi

      - name: Read Go requirement from beszel go.mod
        id: gomod
        shell: bash
        env:
          VERSION: ${{ steps.resolve.outputs.version }}
        run: |
          gomod="$(curl -fsSL "https://raw.githubusercontent.com/henrygd/beszel/v${VERSION}/go.mod")" || {
            echo "::error::Could not fetch go.mod at tag v${VERSION} of henrygd/beszel"
            exit 1
          }
          required="$(printf '%s\n' "${gomod}" | sed -n -E 's/^go ([0-9][0-9.]*)$/\1/p' | head -n1)"
          echo "Beszel v${VERSION} go.mod requires Go: ${required:-<none>}"
          echo "required=${required}" >> "$GITHUB_OUTPUT"

      - name: Resolve Entware SDK release asset
        if: steps.gomod.outputs.required != ''
        id: sdk
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="$(gh api repos/ownik/entware-sdk/releases/latest --jq .tag_name)"
          url="$(gh api repos/ownik/entware-sdk/releases/latest \
            --jq '.assets[] | select((.name | contains("aarch64")) and (.name | endswith(".sha256") | not)) | .browser_download_url' \
            | head -n1)"
          if [ -z "$url" ]; then
            echo "::error::No aarch64 SDK asset found in ownik/entware-sdk release ${tag}"
            exit 1
          fi
          echo "Entware SDK release: ${tag}"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "url=${url}" >> "$GITHUB_OUTPUT"

      - name: Cache Entware SDK tarball
        if: steps.gomod.outputs.required != ''
        id: cache
        uses: actions/cache@v4
        with:
          path: sdk.tar.zst
          key: entware-sdk-${{ steps.sdk.outputs.tag }}

      - name: Download Entware SDK tarball
        if: steps.gomod.outputs.required != '' && steps.cache.outputs.cache-hit != 'true'
        shell: bash
        env:
          SDK_URL: ${{ steps.sdk.outputs.url }}
        run: |
          curl -fsSL "${SDK_URL}" -o sdk.tar.zst

      - name: Compare SDK Go version with beszel requirement
        if: steps.gomod.outputs.required != ''
        shell: bash
        env:
          VERSION: ${{ steps.resolve.outputs.version }}
          REQUIRED: ${{ steps.gomod.outputs.required }}
          SDK_TAG: ${{ steps.sdk.outputs.tag }}
        run: |
          mkdir -p sdk-root
          tar --zstd -xf sdk.tar.zst -C sdk-root --wildcards --wildcards-match-slash '*staging_dir/host/go/bin/go' || true
          tar --zstd -xf sdk.tar.zst -C sdk-root --wildcards --wildcards-match-slash '*staging_dir/host/go/VERSION' || true
          go_bin="$(find sdk-root -type f -path '*staging_dir/host/go/bin/go' | head -n1)"
          version_file="$(find sdk-root -type f -path '*staging_dir/host/go/VERSION' | head -n1)"
          if [ -n "$version_file" ]; then
            sdk_go="$(sed -n -E '1s/^go([0-9][0-9.]*).*/\1/p' "$version_file")"
            echo "SDK Go version read from the GOROOT VERSION file"
          elif [ -n "$go_bin" ]; then
            go_root="$(cd "$(dirname "$go_bin")/.." && pwd)"
            sdk_go="$(GOTOOLCHAIN=local GOENV=off GOROOT="${go_root}" "${go_bin}" version | sed -E 's/^go version go([0-9.]+).*/\1/')"
            echo "SDK Go version read from 'go version' with GOROOT=${go_root}"
          else
            echo "::error::Could not find staging_dir/host/go/{VERSION,bin/go} inside the Entware SDK tarball"
            exit 1
          fi
          if [ -z "$sdk_go" ]; then
            echo "::error::Could not determine the Go version shipped by the Entware SDK (${SDK_TAG})"
            exit 1
          fi
          echo "Entware SDK ${SDK_TAG} ships Go: ${sdk_go}"
          lowest="$(printf '%s\n' "${REQUIRED}" "${sdk_go}" | sort -V | head -n1)"
          if [ "${lowest}" = "${sdk_go}" ] && [ "${sdk_go}" != "${REQUIRED}" ]; then
            echo "::error::Beszel v${VERSION} requires Go >= ${REQUIRED}, but the Entware SDK (${SDK_TAG}) provides Go ${sdk_go} (GOTOOLCHAIN=local)."
            echo "::error::Not building. Build an older beszel version or wait for an Entware SDK with a newer Go; do not bump the Go toolchain inside this workflow."
            exit 1
          fi
          echo "Go requirement satisfied: ${sdk_go} >= ${REQUIRED}"

  build:
    needs: preflight
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: aarch64
            packages: beszel-agent
          - arch: mipsel
            packages: beszel-agent
          - arch: mips
            packages: beszel-agent

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Patch package version for CI build
        shell: bash
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          echo "Building beszel-agent version: ${VERSION}"
          sed -i -E "s/^PKG_VERSION:=.*/PKG_VERSION:=${VERSION}/" beszel-agent/Makefile
          sed -i -E "s/^PKG_MIRROR_HASH:=.*/PKG_MIRROR_HASH:=skip/" beszel-agent/Makefile

      - name: Build beszel-agent packages
        uses: ownik/gh-action-entware-sdk@v1
        env:
          ARCH: ${{ matrix.arch }}
          PACKAGES: ${{ matrix.packages }}
          V: s
          FEEDNAME: local

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: beszel-agent-${{ needs.preflight.outputs.version }}-${{ matrix.arch }}
          path: bin/targets/**/packages/beszel-agent_*.ipk
          if-no-files-found: warn
          compression-level: 0

  publish-latest-release:
    runs-on: ubuntu-latest
    needs: [ preflight, build ]
    env:
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          path: out
          merge-multiple: true

      - name: Resolve latest target release
        id: target-release
        uses: actions/github-script@v8
        with:
          script: |
            const { owner, repo } = context.repo;
            const releases = await github.paginate(github.rest.repos.listReleases, {
              owner,
              repo,
              per_page: 100,
            });

            const picked = releases.find((rel) => !rel.draft && !rel.prerelease);
            if (!picked) {
              core.setFailed('No release found to update');
              return;
            }

            core.setOutput('id', String(picked.id));
            core.setOutput('tag', picked.tag_name);

      - name: Remove previous beszel-agent ipk assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ steps.target-release.outputs.id }}
        run: |
          gh api "repos/${{ github.repository }}/releases/${RELEASE_ID}/assets" \
            --jq '.[] | select(.name | test("^beszel-agent_.*\\.ipk$")) | .id' \
            | while read -r asset_id; do
                [ -n "$asset_id" ] || continue
                gh api -X DELETE "repos/${{ github.repository }}/releases/assets/${asset_id}"
              done

      - name: Upload new beszel-agent ipk assets to latest release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.target-release.outputs.tag }}
        run: |
          mapfile -t files < <(find out -type f -name 'beszel-agent_*.ipk' | sort)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No beszel-agent ipk files found"
            exit 1
          fi

          printf '%s\n' "${files[@]}"
          gh release upload "$TAG" "${files[@]}" --clobber
