# Experimental ARM64-only WARPSCOUT package build for Keenetic-class Entware targets.
# It repacks the official upstream Linux/ARM64 release asset because WARPSCOUT v0.16.0
# requires Go 1.26.3 while the current Entware SDK ships Go 1.26.1 with GOTOOLCHAIN=local.
#
# This workflow intentionally publishes only an Actions artifact. It does NOT modify the
# repository's "latest" release/feed until a real Keenetic install/runtime test has passed.

name: Build WARPSCOUT aarch64

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'WARPSCOUT version (tag v<version>, e.g. 0.16.0)'
        required: false
        default: '0.16.0'
        type: string
  pull_request:
    branches:
      - gh-action-build
    paths:
      - warpscout/**
      - .github/workflows/build-warpscout.yml

permissions:
  contents: read

concurrency:
  group: build-warpscout-aarch64-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release.outputs.version }}
      hash: ${{ steps.release.outputs.hash }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Resolve official Linux ARM64 release asset
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RAW_VERSION: ${{ inputs.version || '0.16.0' }}
        run: |
          version="${RAW_VERSION#v}"
          if ! printf '%s' "$version" | grep -Eq '^[0-9][0-9A-Za-z.+-]*$'; then
            echo "::error::Invalid WARPSCOUT version '${RAW_VERSION}'"
            exit 1
          fi

          asset="warpscout_${version}_linux_arm64.tar.gz"
          release="$(gh api "repos/vernette/warpscout/releases/tags/v${version}")" || {
            echo "::error::WARPSCOUT release v${version} was not found"
            exit 1
          }
          digest="$(printf '%s' "$release" | jq -r --arg asset "$asset" '.assets[] | select(.name == $asset) | .digest' | head -n1)"
          url="$(printf '%s' "$release" | jq -r --arg asset "$asset" '.assets[] | select(.name == $asset) | .browser_download_url' | head -n1)"

          if [ -z "$url" ] || [ "$url" = "null" ]; then
            echo "::error::Official asset ${asset} is missing from WARPSCOUT v${version}"
            exit 1
          fi
          case "$digest" in
            sha256:*) hash="${digest#sha256:}" ;;
            *)
              echo "::error::GitHub did not provide a sha256 digest for ${asset}: ${digest:-<empty>}"
              exit 1
              ;;
          esac
          if ! printf '%s' "$hash" | grep -Eq '^[0-9a-f]{64}$'; then
            echo "::error::Invalid sha256 digest for ${asset}: ${hash}"
            exit 1
          fi

          echo "WARPSCOUT release: v${version}"
          echo "Official asset: ${asset}"
          echo "Official sha256: ${hash}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "hash=${hash}" >> "$GITHUB_OUTPUT"

      - name: Check pinned package metadata for default build
        if: (inputs.version || '0.16.0') == '0.16.0'
        shell: bash
        env:
          EXPECTED_HASH: ${{ steps.release.outputs.hash }}
        run: |
          pinned_version="$(sed -n 's/^PKG_VERSION:=//p' warpscout/Makefile)"
          pinned_hash="$(sed -n 's/^PKG_HASH:=//p' warpscout/Makefile)"
          [ "$pinned_version" = "0.16.0" ] || {
            echo "::error::warpscout/Makefile default version drifted: ${pinned_version}"
            exit 1
          }
          [ "$pinned_hash" = "$EXPECTED_HASH" ] || {
            echo "::error::warpscout/Makefile PKG_HASH does not match the official v0.16.0 release digest"
            echo "pinned=${pinned_hash}"
            echo "official=${EXPECTED_HASH}"
            exit 1
          }

  build:
    needs: preflight
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Patch requested WARPSCOUT release metadata for CI
        shell: bash
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
          HASH: ${{ needs.preflight.outputs.hash }}
        run: |
          sed -i -E "s/^PKG_VERSION:=.*/PKG_VERSION:=${VERSION}/" warpscout/Makefile
          sed -i -E "s/^PKG_HASH:=.*/PKG_HASH:=${HASH}/" warpscout/Makefile
          grep -E '^(PKG_VERSION|PKG_SOURCE|PKG_HASH):=' warpscout/Makefile

      - name: Build WARPSCOUT aarch64 package
        uses: ownik/gh-action-entware-sdk@v1
        env:
          ARCH: aarch64
          PACKAGES: warpscout
          V: s
          FEEDNAME: local

      - name: Verify package payload and architecture
        shell: bash
        run: |
          mapfile -t packages < <(find bin/targets -type f -name 'warpscout_*.ipk' | sort)
          if [ "${#packages[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one WARPSCOUT aarch64 IPK, found ${#packages[@]}"
            printf '%s\n' "${packages[@]}"
            exit 1
          fi

          ipk="${packages[0]}"
          echo "Built: ${ipk}"
          work="$(mktemp -d)"
          trap 'rm -rf "$work"' EXIT

          (
            cd "$work"
            ar x "$OLDPWD/$ipk"
            data="$(find . -maxdepth 1 -type f -name 'data.tar.*' | head -n1)"
            [ -n "$data" ] || { echo "::error::IPK has no data archive"; exit 1; }

            mkdir payload
            case "$data" in
              *.gz) tar -xzf "$data" -C payload ;;
              *.xz) tar -xJf "$data" -C payload ;;
              *.zst) tar --zstd -xf "$data" -C payload ;;
              *) tar -xf "$data" -C payload ;;
            esac

            test -x payload/opt/bin/warpscout || {
              echo "::error::/opt/bin/warpscout is missing or not executable"
              exit 1
            }

            file payload/opt/bin/warpscout
            file payload/opt/bin/warpscout | grep -Eiq 'ARM aarch64|ARM64|aarch64' || {
              echo "::error::Packaged WARPSCOUT binary is not identified as ARM64/AArch64"
              exit 1
            }

            readelf -h payload/opt/bin/warpscout | grep -E 'Class:|Machine:' || true
            du -h payload/opt/bin/warpscout
          )

      - name: Upload experimental IPK
        uses: actions/upload-artifact@v6
        with:
          name: warpscout-${{ needs.preflight.outputs.version }}-aarch64
          path: bin/targets/**/packages/warpscout_*.ipk
          if-no-files-found: error
          compression-level: 0
